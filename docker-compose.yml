version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: /entrypoint.sh
    restart: unless-stopped
    networks:
      - ia-network
    environment:
      # Optimizaciones para modelo 3B
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-6}
      MODELO_TEXTO: ${MODELO_TEXTO:-qwen2.5:3b}
      MODELO_VISION: ${MODELO_VISION:-llava:7b}
      MODELO_EMBEDDINGS: ${MODELO_EMBEDDINGS:-nomic-embed-text}
      MODELO_EDITOR: ${MODELO_EDITOR:-qwen2.5:1.5b}
      MODELO_EDITOR_FALLBACK: ${MODELO_EDITOR_FALLBACK:-qwen2.5:0.5b}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # URLs y modelos
      OLLAMA_URL: http://ollama:11434
      MODELO_TEXTO: ${MODELO_TEXTO:-qwen2.5:3b}
      MODELO_VISION: ${MODELO_VISION:-llava:7b}
      MODELO_EMBEDDINGS: ${MODELO_EMBEDDINGS:-nomic-embed-text}
      
      # Ollama config
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-256}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-180000}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-2}
      
      # Editor LLM — perfil rápido CPU (modelo separado)
      MODELO_EDITOR: ${MODELO_EDITOR:-qwen2.5:1.5b}
      MODELO_EDITOR_FALLBACK: ${MODELO_EDITOR_FALLBACK:-qwen2.5:0.5b}
      OLLAMA_EDITOR_NUM_CTX: ${OLLAMA_EDITOR_NUM_CTX:-1536}
      OLLAMA_EDITOR_NUM_PREDICT: ${OLLAMA_EDITOR_NUM_PREDICT:-256}
      OLLAMA_EDITOR_TEMPERATURE: ${OLLAMA_EDITOR_TEMPERATURE:-0.1}
      OLLAMA_EDITOR_TIMEOUT_MS: ${OLLAMA_EDITOR_TIMEOUT_MS:-45000}
      EDITOR_MAX_SOURCE_CHARS: ${EDITOR_MAX_SOURCE_CHARS:-1200}
      OLLAMA_EDITOR_FALLBACK_NUM_CTX: ${OLLAMA_EDITOR_FALLBACK_NUM_CTX:-1024}
      OLLAMA_EDITOR_FALLBACK_NUM_PREDICT: ${OLLAMA_EDITOR_FALLBACK_NUM_PREDICT:-180}
      OLLAMA_EDITOR_FALLBACK_TEMPERATURE: ${OLLAMA_EDITOR_FALLBACK_TEMPERATURE:-0.1}
      OLLAMA_EDITOR_FALLBACK_TIMEOUT_MS: ${OLLAMA_EDITOR_FALLBACK_TIMEOUT_MS:-25000}
      
      # Agent selector
      ENABLE_SEMANTIC_ROUTING: ${ENABLE_SEMANTIC_ROUTING:-false}
      
      # Circuit breaker (Opción C)
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-true}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_TIMEOUT_MS: ${CIRCUIT_BREAKER_TIMEOUT_MS:-30000}
      
      # Embedding cache (Opción C)
      RAG_EMBEDDING_CACHE_ENABLED: ${RAG_EMBEDDING_CACHE_ENABLED:-true}
      RAG_EMBEDDING_CACHE_MAX: ${RAG_EMBEDDING_CACHE_MAX:-2000}
      RAG_EMBEDDING_CACHE_TTL_MS: ${RAG_EMBEDDING_CACHE_TTL_MS:-21600000}
      
      # Context compression (Opción C)
      CONTEXT_COMPRESSION_ENABLED: ${CONTEXT_COMPRESSION_ENABLED:-false}
      CONTEXT_COMPRESSION_MAX_TOKENS: ${CONTEXT_COMPRESSION_MAX_TOKENS:-1024}
      
      # RAG config
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-700}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-80}
      
      # Security
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - ia-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: frontend
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    networks:
      - ia-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
    driver: local

networks:
  ia-network:
    driver: bridge

